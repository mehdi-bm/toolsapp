name: toolbax
description: "جعبه‌ابزار پارسیک: مجموعه‌ای از ابزارهای کاربردی روزمره در یک برنامه ساده و مدرن"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  characters: ^1.4.1

  # State management
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^8.0.3

  # Lightweight local key-value storage (favorites, settings, recent tools)
  shared_preferences: ^2.3.4

  # Persian-digit number formatting
  intl: ^0.20.2

  # Accelerometer access for the Level tool
  sensors_plus: ^7.1.0

  # Camera-based tools: QR/barcode scanning, raw preview for color detector
  # and magnifier, runtime permission handling, share and URL-open actions
  mobile_scanner: ^7.4.0
  camera: ^0.12.0+2
  # Pinned to the 12.x line: permission_handler 13.x pulls in
  # permission_handler_android 14.x, which requires compileSdk 37 — not
  # reliably obtainable on this network/AGP setup. 12.x maps to
  # permission_handler_android ^13.0.0, which only needs compileSdk 35.
  permission_handler: ^12.0.3
  share_plus: ^13.3.0
  url_launcher: ^6.3.2

  # Device tools: torch control without holding a full camera session,
  # approximate microphone sound level. Compass heading is computed in Dart
  # from sensors_plus accelerometer + magnetometer streams (see
  # core/utils/compass_math.dart) rather than a dedicated compass package —
  # flutter_compass, flutter_compass_v2, and flutter_rotation_sensor (via its
  # transitive native_device_orientation dependency) all hardcode an old
  # per-plugin AGP classpath that conflicts with this project's AGP 9.0.1 and
  # fails to build.
  torch_light: ^2.0.0
  noise_meter: ^6.0.0

  # Security tools: pure-Dart QR rendering (no native Android code) and
  # saving the generated QR image to the gallery
  qr_flutter: ^4.1.0
  gal: ^2.3.3

  # Text-to-speech / speech-to-text tool
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  light_compressor_v2: ^1.9.1
  image_picker: ^1.2.3

  # Audio format conversion: the only realistic no-Android-encoder-gap route
  # to real MP3 output (Android's MediaCodec can decode MP3 but never had an
  # encoder). Uses the upstream "audio" flavor specifically (LGPL — excludes
  # x264/x265/xvidcore/vid.stab, the 4 libraries in ffmpeg-kit that are GPL),
  # so no GPL taint for a closed-source app. Pinned via a vendored local copy
  # (see dependency_overrides below) because the published package hardcodes
  # compileSdkVersion 33, which now fails against newer androidx transitive
  # deps that require 34+.
  ffmpeg_kit_audio_flutter: ^1.1.0
  file_picker: ^13.1.0
  flutter_image_compress: ^2.5.1
  connectivity_plus: ^7.3.1
  archive: ^4.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Generates Android launcher icons (incl. adaptive icon) from assets/icon/.
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/fonts/OFL.txt

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#2020B0"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 20
  min_sdk_android: 21

# Locally-patched copy of ffmpeg_kit_audio_flutter — see the dependency
# comment above for why.
dependency_overrides:
  ffmpeg_kit_audio_flutter:
    path: third_party/ffmpeg_kit_audio_flutter
